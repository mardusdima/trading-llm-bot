version: '3.8'

services:
  api:
    build: .
    container_name: trading-bot-api
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tradingbot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./trading_bot:/app/trading_bot

  worker:
    build: .
    container_name: trading-bot-worker
    command: [ "celery", "-A", "trading_bot.tasks", "worker", "--loglevel=info" ]
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tradingbot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./trading_bot:/app/trading_bot

  beat:
    build: .
    container_name: trading-bot-beat
    command: [ "celery", "-A", "trading_bot.tasks", "beat", "--loglevel=info" ]
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tradingbot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./trading_bot:/app/trading_bot

  db:
    image: timescale/timescaledb:2.13.1-pg15
    container_name: trading-bot-db
    restart: always
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
